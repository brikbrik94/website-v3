# Einheitliche Zugriffsbeschränkung für die öffentlichen Routing-Endpoints (routing-proxy.php,
# nearest-stations.php) — Startwert, nach dem Rollout anhand echter Nutzung nachjustieren. Siehe
# docs/superpowers/specs/2026-08-23-routing-endpoints-public-rollout-design.md.
limit_req_zone $binary_remote_addr zone=routing_limit:10m rate=10r/s;

server {
    server_name map.oe5ith.at;

    root /var/www/map.oe5ith.at/dist;
    index index.html index.php;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Security Headers — nicht aus snippets/security-headers.conf (dessen CSP passt hier nicht:
    # kein worker-src → blockiert MapLibre GLs Worker-Erstellung via new Worker(URL.createObjectURL(...))
    # ["blob:"], und connect-src kennt tiles.oe5ith.at/api.oe5ith.at nicht, die der Browser hier
    # direkt aufruft). Die ersten 5 Header 1:1 aus dem Snippet übernommen, CSP für map.oe5ith.at
    # eigens gebaut (siehe docs/2026-07-24-website-v3-externe-urls.md für die Herleitung).
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; worker-src 'self' blob:; connect-src 'self' https://tiles.oe5ith.at wss://api.oe5ith.at; frame-ancestors 'self';" always;

    # 1. Frontend & Static Files
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 2. PHP API Handler
    # Handles all explicit .php calls (e.g., /api/nah.php, /api/ors.php)
    location ~ \.php$ {
        # Root points to the project base, so /api/nah.php is found in /var/www/map.oe5ith.at/api/nah.php
        root /var/www/map.oe5ith.at;

        include snippets/fastcgi-php.conf;

        # Path from systemctl status php8.4-fpm
        fastcgi_pass unix:/run/php/php-fpm.sock;

        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Diagnose-Endpoint in Produktion blockieren — exponiert PHP-Version, DB-Host/Port/Name/User
    # und ORS-Health-Status ohne Zugriffsschutz (siehe TODO.md, OWASP A01/A05 in
    # docs/security/owasp-top10-checklist.md). Exact-Match hat in nginx Vorrang vor dem
    # generischen ~ \.php$ -Handler oben, unabhängig von der Reihenfolge im File.
    location = /api/diag.php {
        deny all;
    }

    # Öffentliche Routing-Endpoints (ORS + Valhalla) — einheitliche Zugriffsbeschränkung statt
    # providerspezifischer Einzellösungen. limit_req: Missbrauchsbremse pro Client-IP.
    # valid_referers: verhindert, dass fremde Seiten diese Endpoints einbetten/mitbenutzen und
    # dadurch unsere ORS/Valhalla-Kosten hochtreiben (kein Schutz gegen einen gezielten
    # Angreifer mit curl, der den Header frei setzen kann — dafür ist limit_req da). Exact-Match
    # hat in nginx Vorrang vor dem generischen ~ \.php$ -Handler oben, unabhängig von der
    # Reihenfolge im File — FastCGI-Setup deshalb hier dupliziert (nginx vererbt Direktiven
    # nicht zwischen Sibling-Locations), analog dem bereits bestehenden Stil dieser Datei.
    location = /api/routing-proxy.php {
        limit_req zone=routing_limit burst=20 nodelay;
        valid_referers none blocked map.oe5ith.at;
        if ($invalid_referer) { return 403; }

        root /var/www/map.oe5ith.at;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location = /api/nearest-stations.php {
        limit_req zone=routing_limit burst=20 nodelay;
        valid_referers none blocked map.oe5ith.at;
        if ($invalid_referer) { return 403; }

        root /var/www/map.oe5ith.at;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Security
    location ~ /\.ht {
        deny all;
    }

    # SSL Configuration (managed by Certbot)
    listen [::]:443 ssl; 
    listen 443 ssl; 
    ssl_certificate /etc/letsencrypt/live/map.oe5ith.at/fullchain.pem; 
    ssl_certificate_key /etc/letsencrypt/live/map.oe5ith.at/privkey.pem; 
    include /etc/letsencrypt/options-ssl-nginx.conf; 
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; 
}

# HTTP Server (Redirects & Local Dev)
server {
    listen 80;
    listen [::]:80;
    server_name map.oe5ith.at localhost;

    # Production: Redirect map.oe5ith.at to HTTPS
    if ($host = map.oe5ith.at) {
        return 301 https://$host$request_uri;
    }

    # Local Dev: Allow Vite Proxy (localhost) to access API
    location /api/ {
        root /var/www/map.oe5ith.at;
        index index.php;
        try_files $uri $uri.php =404;
    }

    # Local Dev: PHP-FPM Handler for localhost
    location ~ \.php$ {
        root /var/www/map.oe5ith.at;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # Default fallback for other port 80 requests
    location / {
        return 404;
    }
}
